name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump for the release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" needs a logo PR to home-assistant/brands; not required for a custom repository.
          ignore: brands

  # The one check branch protection requires. It fails if any job above failed or was cancelled.
  ci-ok:
    name: CI passed
    if: always()
    needs: [tests, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]

  # Dependabot PRs merge themselves once every check passed.
  automerge:
    name: Merge Dependabot PR
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Merge, or ask Dependabot to rebase if main moved on
        run: |
          state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
          echo "merge state: $state"
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR" --body "@dependabot rebase"
            exit 0
          fi
          gh pr merge "$PR" --merge --delete-branch
          # A merge made with GITHUB_TOKEN doesn't start a push run, so start the release run on main.
          gh workflow run ci.yml --ref main

  # Every merge to main becomes a release. HACS installs guest_wifi.zip, whose manifest carries the release version.
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            next=$(jq -r .version custom_components/guest_wifi/manifest.json)
          elif git tag --points-at HEAD | grep -qx "$last"; then
            echo "HEAD is already released as $last"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${last:-none})"
      - name: Build guest_wifi.zip
        if: steps.version.outputs.skip != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          cd custom_components/guest_wifi
          jq --arg v "$V" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          find . -name __pycache__ -prune -exec rm -rf {} +
          zip -r "$GITHUB_WORKSPACE/guest_wifi.zip" . -x '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/guest_wifi.zip"
      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: gh release create "v$V" guest_wifi.zip --target "$GITHUB_SHA" --title "v$V" --generate-notes
