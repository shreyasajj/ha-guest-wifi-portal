# Weekly dependency PRs. CI merges them on its own once "CI passed" is green
# (job "Merge Dependabot PR" in workflows/ci.yml), which then publishes a release for HACS.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00" }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00" }
    groups:
      actions:
        patterns: ["*"]
